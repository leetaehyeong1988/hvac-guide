<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>시설관리 실무 포켓 툴</title>
  
  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/4814/4814268.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif; background-color: #f1f5f9; }
    input[type=range] { accent-color: #2563eb; }
  </style>
</head>
<body class="text-slate-800 pb-20">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-20">
    <div class="max-w-lg mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-base font-bold tracking-tight flex items-center gap-1.5">
          <span>🏢</span> 시설관리 실무 포켓 툴
        </h1>
        <p class="text-[11px] text-slate-400">기숙사·교육센터·게스트하우스 통합 관리</p>
      </div>
      <button onclick="getGPSWeather()" class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition shrink-0">
        <span>📍</span> 내위치
      </button>
    </div>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-lg mx-auto p-4 space-y-4">

    <!-- TAB 1: 공조 가이드 -->
    <div id="tab-content-1" class="tab-pane space-y-4">
      <!-- 지역 선택 카드 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <label class="text-xs font-bold text-slate-500 uppercase">관할 지역 선택</label>
          <span id="weather-status" class="text-xs text-emerald-600 font-medium">기상 연동 대기중</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <select id="sido-select" onchange="updateSigungu()" class="bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 font-semibold focus:outline-none focus:border-blue-500"></select>
          <select id="sigungu-select" onchange="fetchSelectedWeather()" class="bg-slate-50 border border-slate-300 text-sm rounded-xl p-2.5 font-semibold focus:outline-none focus:border-blue-500"></select>
        </div>
        <div class="bg-slate-50 rounded-xl p-3 flex justify-around items-center border border-slate-100">
          <div class="text-center">
            <div class="text-[11px] text-slate-500">외기 온도</div>
            <div id="disp-temp" class="text-lg font-extrabold text-slate-800">--°C</div>
          </div>
          <div class="h-8 w-px bg-slate-200"></div>
          <div class="text-center">
            <div class="text-[11px] text-slate-500">외기 습도</div>
            <div id="disp-hum" class="text-lg font-extrabold text-blue-600">--%</div>
          </div>
          <div class="h-8 w-px bg-slate-200"></div>
          <div class="text-center">
            <div class="text-[11px] text-slate-500">외기 체감</div>
            <div id="disp-apparent" class="text-lg font-extrabold text-slate-700">--°C</div>
          </div>
        </div>
      </section>

      <!-- 시설 유형 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <label class="text-xs font-bold text-slate-500 uppercase block mb-2">관리 구역 선택</label>
        <div class="grid grid-cols-3 gap-2" id="facility-buttons">
          <button onclick="setFacility('dorm', this)" class="fac-btn bg-blue-600 text-white text-xs font-bold py-2.5 rounded-xl border border-blue-600 transition truncate px-1">기숙사(890세대)</button>
          <button onclick="setFacility('edu', this)" class="fac-btn bg-slate-50 text-slate-600 text-xs font-bold py-2.5 rounded-xl border border-slate-200 transition truncate px-1">교육센터(20실)</button>
          <button onclick="setFacility('vip', this)" class="fac-btn bg-slate-50 text-slate-600 text-xs font-bold py-2.5 rounded-xl border border-slate-200 transition truncate px-1">VIP 게스트(60실)</button>
        </div>
      </section>

      <!-- 결과 카드 -->
      <section id="result-card" class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 rounded-2xl shadow-md space-y-4">
        <div class="flex justify-between items-start gap-2">
          <div class="min-w-0 flex-1">
            <span id="season-badge" class="inline-block bg-white/20 text-white text-xs font-bold px-2.5 py-1 rounded-full truncate max-w-full">계절 분석 중</span>
            <h2 class="text-xs text-blue-100 mt-2">권장 실내 설정 온도</h2>
            <div class="flex flex-wrap items-center gap-2 mt-1">
              <span id="target-temp" class="text-4xl font-black tracking-tight">--.-°C</span>
              <span id="hvac-mode" class="text-xs font-bold bg-white text-blue-700 px-2 py-1 rounded-md whitespace-nowrap">대기</span>
            </div>
          </div>
          <div class="text-right bg-black/20 p-2.5 rounded-xl shrink-0">
            <div class="text-[10px] text-blue-200 whitespace-nowrap">실내외 온도차</div>
            <div id="temp-diff" class="text-base font-bold whitespace-nowrap mt-0.5">--°C</div>
          </div>
        </div>
        <div class="bg-white/10 rounded-xl p-3 text-xs leading-relaxed text-blue-50" id="guide-comment">
          지역을 선택하시면 외기 조건에 맞춘 공조 제어 가이드를 계산합니다.
        </div>
      </section>

      <!-- 설비 점검 체크포인트 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2.5">
        <h3 class="text-xs font-bold text-slate-500 uppercase">오늘의 설비 점검 포인트</h3>
        <ul id="checklist-area" class="space-y-2 text-sm text-slate-700"></ul>
      </section>
    </div>

    <!-- TAB 2: 출동 매뉴얼 (2번 기능) -->
    <div id="tab-content-2" class="tab-pane hidden space-y-4">
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-500 uppercase">민원 유형별 긴급 출동 가이드</h3>
          <span class="text-[11px] text-blue-600 font-semibold">신입·당직자 필수 툴</span>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="selectTrouble('fcu')" class="trouble-btn bg-blue-600 text-white text-xs font-bold p-3 rounded-xl border border-blue-600 transition text-left">❄️ FCU 냉난방 불량</button>
          <button onclick="selectTrouble('leak')" class="trouble-btn bg-slate-50 text-slate-700 text-xs font-bold p-3 rounded-xl border border-slate-200 transition text-left">💧 누수 및 배관 막힘</button>
          <button onclick="selectTrouble('light')" class="trouble-btn bg-slate-50 text-slate-700 text-xs font-bold p-3 rounded-xl border border-slate-200 transition text-left">💡 전등 및 전원 차단</button>
          <button onclick="selectTrouble('lock')" class="trouble-btn bg-slate-50 text-slate-700 text-xs font-bold p-3 rounded-xl border border-slate-200 transition text-left">🚪 도어락 및 도장 불량</button>
        </div>
      </section>

      <!-- 상세 매뉴얼 출력 박스 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3" id="trouble-detail-box">
        <!-- JS 동적 로드 -->
      </section>
    </div>

    <!-- TAB 3: 객실/강의실 순찰 보드 (3번 기능) -->
    <div id="tab-content-3" class="tab-pane hidden space-y-4">
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-slate-500 uppercase">순찰 및 입실 전 점검 보드</h3>
          <button onclick="resetBoard()" class="text-[11px] text-red-500 underline">전체 초기화</button>
        </div>
        <!-- 구역 선택 탭 -->
        <div class="grid grid-cols-2 gap-2">
          <button onclick="setBoardZone('edu', this)" id="board-btn-edu" class="board-zone-btn bg-blue-600 text-white text-xs font-bold py-2 rounded-xl transition">교육센터 (20실)</button>
          <button onclick="setBoardZone('vip', this)" id="board-btn-vip" class="board-zone-btn bg-slate-50 text-slate-600 text-xs font-bold py-2 rounded-xl border border-slate-200 transition">VIP 게스트하우스 (60실)</button>
        </div>
        <div class="flex gap-4 text-[11px] text-slate-500 pt-1 justify-center">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-slate-200 inline-block"></span> 미점검</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-500 inline-block"></span> 정상</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-rose-500 inline-block"></span> 이상/메모</span>
        </div>
      </section>

      <!-- 바둑판 호실 그리드 -->
      <section class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
        <div id="room-grid" class="grid grid-cols-4 gap-2.5">
          <!-- JS 동적 생성 -->
        </div>
      </section>
    </div>

  </main>

  <!-- 하단 네비게이션 바 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 p-2 z-20 shadow-lg">
    <div class="max-w-lg mx-auto grid grid-cols-3 gap-1">
      <button onclick="switchTab(1)" id="nav-btn-1" class="nav-btn flex flex-col items-center py-1.5 text-blue-600 font-bold text-xs rounded-xl transition">
        <span class="text-lg">🌤️</span>
        <span>공조가이드</span>
      </button>
      <button onclick="switchTab(2)" id="nav-btn-2" class="nav-btn flex flex-col items-center py-1.5 text-slate-400 font-medium text-xs rounded-xl transition">
        <span class="text-lg">🛠️</span>
        <span>출동매뉴얼</span>
      </button>
      <button onclick="switchTab(3)" id="nav-btn-3" class="nav-btn flex flex-col items-center py-1.5 text-slate-400 font-medium text-xs rounded-xl transition">
        <span class="text-lg">📋</span>
        <span>순찰점검보드</span>
      </button>
    </div>
  </nav>

  <script>
    // --- 1. 지역 데이터 ---
    const KOREA_REGIONS = {
      "경상남도": {
        "창원시 성산구": [35.204, 128.681], "창원시 의창구": [35.254, 128.639],
        "창원시 마산합포구": [35.183, 128.567], "창원시 마산회원구": [35.221, 128.579],
        "창원시 진해구": [35.149, 128.660], "김해시": [35.228, 128.889],
        "양산시": [35.335, 129.037], "진주시": [35.180, 128.107], "거제시": [34.880, 128.621]
      },
      "서울특별시": {
        "강남구": [37.517, 127.047], "서초구": [37.483, 127.032], "송파구": [37.514, 127.105],
        "영등포구": [37.526, 126.896], "마포구": [37.566, 126.901], "종로구": [37.573, 126.979]
      },
      "부산광역시": {
        "해운대구": [35.163, 129.163], "부산진구": [35.162, 129.053], "강서구": [35.212, 128.980], "사하구": [35.104, 128.974]
      },
      "인천광역시": { "연수구(송도)": [37.410, 126.678], "남동구": [37.447, 126.731], "서구(청라)": [37.545, 126.676] },
      "대구광역시": { "수성구": [35.858, 128.630], "달서구": [35.829, 128.532], "중구": [35.869, 128.606] },
      "대전광역시": { "유성구": [36.362, 127.356], "서구": [36.355, 127.383] },
      "광주광역시": { "서구": [35.152, 126.889], "북구": [35.174, 126.912] },
      "울산광역시": { "남구": [35.543, 129.330], "울주군": [35.522, 129.242] },
      "경기도": { "수원시 영통구": [37.259, 127.046], "성남시 분당구": [37.382, 127.118], "화성시(동탄)": [37.200, 127.075] },
      "강원특별자치도": { "춘천시": [37.881, 127.729], "원주시": [37.342, 127.920] },
      "충청북도": { "청주시 흥덕구": [36.635, 127.426], "충주시": [36.991, 127.925] },
      "충청남도": { "천안시 서북구": [36.815, 127.113], "아산시": [36.789, 127.001] },
      "전북특별자치도": { "전주시 완산구": [35.812, 127.119], "군산시": [35.967, 126.736] },
      "전라남도": { "여수시": [34.760, 127.662], "순천시": [34.950, 127.487] },
      "경상북도": { "포항시 남구": [36.019, 129.343], "구미시": [36.119, 128.344] },
      "제주특별자치도": { "제주시": [33.499, 126.531], "서귀포시": [33.254, 126.560] }
    };

    let currentTemp = 20;
    let currentHum = 50;
    let facilityType = 'dorm';

    // --- 탭 전환 로직 ---
    function switchTab(tabNum) {
      document.querySelectorAll('.tab-pane').forEach((el, idx) => {
        el.classList.toggle('hidden', idx + 1 !== tabNum);
      });
      document.querySelectorAll('.nav-btn').forEach((btn, idx) => {
        if (idx + 1 === tabNum) {
          btn.className = "nav-btn flex flex-col items-center py-1.5 text-blue-600 font-bold text-xs rounded-xl transition";
        } else {
          btn.className = "nav-btn flex flex-col items-center py-1.5 text-slate-400 font-medium text-xs rounded-xl transition";
        }
      });
      window.scrollTo(0, 0);
    }

    // --- 초기화 ---
    window.onload = () => {
      const sidoSel = document.getElementById('sido-select');
      Object.keys(KOREA_REGIONS).forEach(sido => {
        const opt = document.createElement('option');
        opt.value = sido; opt.textContent = sido;
        sidoSel.appendChild(opt);
      });
      sidoSel.value = "경상남도";
      updateSigungu();
      selectTrouble('fcu'); // 출동 매뉴얼 기본값
      initBoard();          // 순찰 보드 초기화
      registerSW();
    };

    function updateSigungu() {
      const sido = document.getElementById('sido-select').value;
      const sigunguSel = document.getElementById('sigungu-select');
      sigunguSel.innerHTML = '';
      Object.keys(KOREA_REGIONS[sido]).forEach(sigungu => {
        const opt = document.createElement('option');
        opt.value = sigungu; opt.textContent = sigungu;
        sigunguSel.appendChild(opt);
      });
      if (sido === "경상남도") sigunguSel.value = "창원시 성산구";
      fetchSelectedWeather();
    }

    async function fetchSelectedWeather() {
      const sido = document.getElementById('sido-select').value;
      const sigungu = document.getElementById('sigungu-select').value;
      const [lat, lon] = KOREA_REGIONS[sido][sigungu];
      await getWeatherFromAPI(lat, lon, `${sigungu}`);
    }

    function getGPSWeather() {
      if (!navigator.geolocation) { alert("GPS를 지원하지 않습니다."); return; }
      document.getElementById('weather-status').textContent = "GPS 탐색중...";
      navigator.geolocation.getCurrentPosition(
        async (pos) => { await getWeatherFromAPI(pos.coords.latitude, pos.coords.longitude, "현재위치"); },
        () => { alert("위치 권한 거부됨"); document.getElementById('weather-status').textContent = "GPS 실패"; }
      );
    }

    async function getWeatherFromAPI(lat, lon, label) {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature&timezone=Asia%2FSeoul`;
        const res = await fetch(url);
        const data = await res.json();
        currentTemp = data.current.temperature_2m;
        currentHum = data.current.relative_humidity_2m;
        const apparent = data.current.apparent_temperature;

        document.getElementById('disp-temp').textContent = `${currentTemp.toFixed(1)}°C`;
        document.getElementById('disp-hum').textContent = `${currentHum}%`;
        document.getElementById('disp-apparent').textContent = `${apparent.toFixed(1)}°C`;
        document.getElementById('weather-status').textContent = `● ${label} 연동됨`;
        calculateHVAC(currentTemp, currentHum);
      } catch (e) {
        document.getElementById('weather-status').textContent = "통신 오류";
      }
    }

    function setFacility(type, btn) {
      facilityType = type;
      document.querySelectorAll('.fac-btn').forEach(b => {
        b.className = "fac-btn bg-slate-50 text-slate-600 text-xs font-bold py-2.5 rounded-xl border border-slate-200 transition truncate px-1";
      });
      btn.className = "fac-btn bg-blue-600 text-white text-xs font-bold py-2.5 rounded-xl border border-blue-600 transition truncate px-1";
      calculateHVAC(currentTemp, currentHum);
    }

    function calculateHVAC(extTemp, extHum) {
      let target = 22.0, mode = "송풍/환기", badge = "환절기", comment = "", checks = [];
      const card = document.getElementById('result-card');
      let offset = (facilityType === 'vip') ? 0.5 : (facilityType === 'dorm' ? 0 : -1.0);

      if (extTemp < 5) {
        badge = extTemp < -3 ? "❄️ 혹한기 동파주의" : "🧣 동절기 난방";
        mode = "난방 운전"; target = 20.0 + offset;
        card.className = "bg-gradient-to-br from-orange-600 to-red-700 text-white p-5 rounded-2xl shadow-md space-y-4";
        comment = `중앙난방 수온 공급 기준에 맞춰 ${target.toFixed(1)}°C 부근으로 세팅을 유도하세요. 과열 시 실내 건조 유발`;
        checks = ["외기 도입 댐퍼 최소화 (10% 개도)", "복도 및 로비 노출 배관 동파 방지 확인", "창호 결로 발생 세대 수시 순찰"];
      } else if (extTemp >= 5 && extTemp < 16) {
        badge = "🍂 서늘한 환절기"; mode = "약난방/예열"; target = 21.0 + offset;
        card.className = "bg-gradient-to-br from-amber-500 to-orange-600 text-white p-5 rounded-2xl shadow-md space-y-4";
        comment = `일교차가 큽니다. 오전 입실 시간대 집중 예열 후 오후에는 송풍 및 외기 환기 위주로 운전하세요.`;
        checks = ["오전 예열 후 난방수 공급 밸브 개도 조절", "전열교환기(환기유닛) 필터 상태 점검"];
      } else if (extTemp >= 16 && extTemp <= 24) {
        badge = "🌿 쾌적·외기냉방"; mode = "외기 도입"; target = 22.5 + offset;
        card.className = "bg-gradient-to-br from-emerald-600 to-teal-700 text-white p-5 rounded-2xl shadow-md space-y-4";
        comment = `냉난방 가동 없이 외기 도입만으로도 쾌적한 최적의 기온입니다.`;
        checks = ["공조기 외기 댐퍼 개방하여 무동력 외기 환기", "냉동기 및 보일러 대기 전력 차단 확인"];
      } else if (extTemp > 24 && extTemp <= 30) {
        badge = "☀️ 하절기 냉방"; mode = "냉방 운전"; target = Math.max(25.0, extTemp - 5.0) + offset;
        card.className = "bg-gradient-to-br from-blue-600 to-indigo-700 text-white p-5 rounded-2xl shadow-md space-y-4";
        comment = `실내외 온도차 5~6°C 이내 유지. 중앙 냉온수 공급 압력 및 FCU 드레인 구배 확인 핵심`;
        checks = ["FCU 드레인 배관 응수 역류 및 막힘 점검", "고온다습 시 제습(풍량 약) 운전 병행 안내"];
      } else {
        badge = "🔥 폭염기 집중관리"; mode = "강력냉방"; target = Math.min(26.5, Math.max(25.5, extTemp - 6.5)) + offset;
        card.className = "bg-gradient-to-br from-indigo-700 to-purple-800 text-white p-5 rounded-2xl shadow-md space-y-4";
        comment = `폭염기입니다. 냉방병 방지 및 최대수요전력 관리를 위해 ${target.toFixed(1)}°C 방어 운전 필요`;
        checks = ["중앙 냉동기 고압 차단 스위치 모니터링", "게스트하우스 및 강의실 출입문 개방 자제 홍보"];
      }

      document.getElementById('season-badge').textContent = badge;
      document.getElementById('target-temp').textContent = `${target.toFixed(1)}°C`;
      document.getElementById('hvac-mode').textContent = mode;
      document.getElementById('temp-diff').textContent = `${Math.abs(extTemp - target).toFixed(1)}°C 차이`;
      document.getElementById('guide-comment').textContent = comment;
      document.getElementById('checklist-area').innerHTML = checks.map(item => `
        <li class="flex items-start gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
          <span class="text-blue-600 font-bold">✓</span><span>${item}</span>
        </li>`).join('');
    }

    // --- 2. 출동 매뉴얼 데이터 (2번 기능) ---
    const TROUBLE_DATA = {
      fcu: {
        title: "❄️ FCU (팬코일유닛) 냉난방 불량 민원",
        tools: ["드라이버 (+/-)", "후래쉬 (손전등)", "마른 수건 (드레인 확인용)", "테스터기"],
        steps: [
          "<strong>1단계 (전원 및 컨트롤러 확인):</strong> 벽부형 컨트롤러 액정 표시 여부 및 차단기 트립 여부 확인",
          "<strong>2단계 (밸브 동작 확인):</strong> 천장 점검구 열고 2방향/3방향 전동 밸브바디의 모터 구동 및 열림 상태 확인",
          "<strong>3단계 (드레인 판 점검):</strong> 냉방 시 응축수가 넘쳐 드레인 센서(오버플로우)가 동작했는지 물 고임 확인"
        ],
        logic: "중앙난방식이므로 보일러/냉동기 공급 수온이 도달하는 데 시간이 걸릴 수 있음을 안내하고, 풍량 조절(미풍~강풍)을 통해 열교환 유도"
      },
      leak: {
        title: "💧 누수 및 배관 드레인 막힘 민원",
        tools: ["고무장갑", "석션기 (간이 펌프)", "몽키 스패너", "걸레 및 대야"],
        steps: [
          "<strong>1단계 (유입원 파악):</strong> 위층 세대 누수인지, 에어컨/FCU 드레인 역류인지, 급수/환수 배관 조인트 부위 누수인지 확인",
          "<strong>2단계 (응급 조치):</strong> 드레인 호스 이물질 막힘일 경우 석션기로 이물질 흡입 청소, 밸브 누수 시 해당 구역 국부 밸브 차단",
          "<strong>3단계 (주변 보양):</strong> 마른 수건과 대야로 2차 피해 방지 후 바닥 건조"
        ],
        logic: "누수 발생 시 즉시 사진 촬영 후 인수인계 톡방 공유 및 피해 면적 확인"
      },
      light: {
        title: "💡 전등 불량 및 전원 차단 (누전/합선)",
        tools: ["절연 테스터기", "후레쉬", "예비 LED 안정기 / 차단기", "검전기"],
        steps: [
          "<strong>1단계 (세대 분전반 확인):</strong> 누전차단기(ELB)가 내려가 있는지, 배선용(MCCB)이 내려가 있는지 확인",
          "<strong>2단계 (절연 저항 측정):</strong> 차단기를 올렸을 때 즉시 떨어지면 해당 라인(전등/전열) 누전 여부 검전기로 확인",
          "<strong>3단계 (등기구 안정기 교체):</strong> 깜빡임이나 점등 불량 시 안정기 출력 전압 및 커넥터 체결 상태 확인"
        ],
        logic: "안전제일: 감전 사고 방지를 위해 작업 전 반드시 해당 라인 차단기 오프(OFF) 확인 필수"
      },
      lock: {
        title: "🚪 도어락 작동 불량 및 개방 민원",
        tools: ["+ 드라이버", "9V 사각 건전지 (비상전원용)", "마스터 키"],
        steps: [
          "<strong>1단계 (전원 방전 확인):</strong> 건전지 방전 시 외부 비상 전원 단자에 9V 건전지 접촉하여 번호 입력",
          "<strong>2단계 (모티스/데드볼트 점검):</strong> 문이 닫히면서 걸쇠(스트라이크)와 데드볼트가 마찰을 일으키는지 유격 확인",
          "<strong>3단계 (기계적 오류):</strong> 건전지 교체 후에도 오작동 시 리셋 버튼 누름"
        ],
        logic: "입주자 본인 확인(신분증 또는 등록 정보) 후 비상 개방 조치 진행"
      }
    };

    function selectTrouble(type) {
      document.querySelectorAll('.trouble-btn').forEach(b => {
        b.className = "trouble-btn bg-slate-50 text-slate-700 text-xs font-bold p-3 rounded-xl border border-slate-200 transition text-left";
      });
      event.currentTarget.className = "trouble-btn bg-blue-600 text-white text-xs font-bold p-3 rounded-xl border border-blue-600 transition text-left";

      const data = TROUBLE_DATA[type];
      const box = document.getElementById('trouble-detail-box');
      box.innerHTML = `
        <h4 class="text-sm font-extrabold text-slate-900 pb-2 border-b border-slate-100">${data.title}</h4>
        
        <div class="space-y-1.5 pt-1">
          <span class="text-xs font-bold text-blue-600 uppercase">🎒 필수 지참 공구 및 자재</span>
          <div class="flex flex-wrap gap-1.5 pt-1">
            ${data.tools.map(t => `<span class="bg-slate-100 text-slate-700 text-xs font-semibold px-2.5 py-1 rounded-lg border border-slate-200">✓ ${t}</span>`).join('')}
          </div>
        </div>

        <div class="space-y-1.5 pt-2">
          <span class="text-xs font-bold text-slate-700 uppercase">🔍 현장 1차 점검 순서</span>
          <div class="space-y-2 bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs leading-relaxed text-slate-700">
            ${data.steps.map(s => `<div>${s}</div>`).join('')}
          </div>
        </div>

        <div class="bg-blue-50 p-3 rounded-xl border border-blue-100 space-y-1">
          <span class="text-[11px] font-bold text-blue-800 uppercase">💬 입주민 민원 응대 논리</span>
          <p class="text-xs text-blue-900 leading-relaxed">${data.logic}</p>
        </div>
      `;
    }

    // --- 3. 순찰 보드 데이터 (3번 기능) ---
    let boardZone = 'edu'; // edu (20실), vip (60실)
    let roomStates = { edu: {}, vip: {} };

    function setBoardZone(zone, btn) {
      boardZone = zone;
      document.querySelectorAll('.board-zone-btn').forEach(b => {
        b.className = "board-zone-btn bg-slate-50 text-slate-600 text-xs font-bold py-2 rounded-xl border border-slate-200 transition";
      });
      btn.className = "board-zone-btn bg-blue-600 text-white text-xs font-bold py-2 rounded-xl transition";
      renderBoard();
    }

    function initBoard() {
      // 교육센터 20실 (101~110, 201~210)
      for(let i=101; i<=110; i++) roomStates.edu[i] = 0; // 0: 미점검, 1: 정상, 2: 이상
      for(let i=201; i<=210; i++) roomStates.edu[i] = 0;
      
      // VIP 게스트하우스 60실 (2층~4층, 각 20실: x01~x20)
      for(let floor=2; floor<=4; floor++) {
        for(let i=1; i<=20; i++) {
          let roomNo = floor * 100 + i;
          roomStates.vip[roomNo] = 0;
        }
      }
      renderBoard();
    }

    function renderBoard() {
      const grid = document.getElementById('room-grid');
      const rooms = roomStates[boardZone];
      grid.innerHTML = Object.keys(rooms).map(roomNo => {
        let state = rooms[roomNo];
        let bgClass = "bg-slate-100 text-slate-700 border-slate-200";
        if(state === 1) bgClass = "bg-emerald-500 text-white border-emerald-600 shadow-sm";
        if(state === 2) bgClass = "bg-rose-500 text-white border-rose-600 shadow-sm animate-pulse";

        return `
          <button onclick="toggleRoom('${boardZone}', '${roomNo}')" class="${bgClass} font-bold p-3 rounded-xl border text-center transition flex flex-col items-center justify-center gap-0.5 active:scale-95">
            <span class="text-sm">${roomNo}</span>
            <span class="text-[9px] opacity-80">${state === 0 ? '미점검' : (state === 1 ? '정상' : '이상')}</span>
          </button>
        `;
      }).join('');
    }

    function toggleRoom(zone, roomNo) {
      let current = roomStates[zone][roomNo];
      roomStates[zone][roomNo] = (current + 1) % 3; // 0 -> 1 -> 2 -> 0
      renderBoard();
    }

    function resetBoard() {
      if(confirm("현재 구역의 점검 상태를 모두 초기화하시겠습니까?")) {
        Object.keys(roomStates[boardZone]).forEach(k => roomStates[boardZone][k] = 0);
        renderBoard();
      }
    }

    function registerSW() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }
    }
  </script>
</body>
</html>
